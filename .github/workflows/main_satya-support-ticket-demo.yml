
name: Build and deploy Python app to Azure Web App - satya-support-ticket-demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Prepare backend deployment package
        run: |
          mkdir deploy
          cp -R backend/. deploy/
          rm -rf deploy/venv
          rm -rf deploy/chroma_db
          rm -rf deploy/documents
          rm -rf deploy/__pycache__
          rm -rf deploy/.pytest_cache
          rm -f deploy/.env
          find deploy -type d -name "__pycache__" -prune -exec rm -rf {} +
          find deploy -type f -name "*.pyc" -delete

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: satya-support-ticket-demo
          slot-name: Production
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_6216365270ED428F954716C01FB2BF03 }}
